# SUSPENDED 2026-09-17 (Gilles): see build-job-2204 above.
test-job-2204:
  stage: test
  image: $CI_REGISTRY_IMAGE/ci-build:22.04
  dependencies:
    - build-job-2204
  variables:
    DEB_FILE_LATEST: "ostserver_latest_2204_amd64.deb"
  script:
    - ./CI/CI-test.sh
  artifacts:
    paths:
      - server.log
      - ws.log
    expire_in: 4 week
  allow_failure: true
  rules:
    - when: never

test-job-2404:
  stage: test
  image: $CI_REGISTRY_IMAGE/ci-build:24.04
  dependencies:
    - build-job-2404
  variables:
    DEB_FILE_LATEST: "ostserver_latest_2404_amd64.deb"
  script:
    - ./CI/CI-test.sh
  artifacts:
    paths:
      - server.log
      - ws.log
    expire_in: 4 week
  allow_failure: true
  <<: *test-rules-mr-or-tag

test-job-2604:
  stage: test
  image: $CI_REGISTRY_IMAGE/ci-build:26.04
  dependencies:
    - build-job-2604
  variables:
    DEB_FILE_LATEST: "ostserver_latest_2604_amd64.deb"
  script:
    - ./CI/CI-test.sh
  artifacts:
    paths:
      - server.log
      - ws.log
    expire_in: 4 week
  <<: *test-rules

release-job-tag:
  stage: release
  dependencies:
    - build-job-2204
    - build-job-2404
    - build-job-2604
    - build-job-fedora
    - build-job-arch
    - build-doc
    - build-web-zip
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - sh ./CI/CI-upload-release-tag.sh
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'

release-job-latest:
  stage: release
  dependencies:
    - build-job-2204
    - build-job-2404
    - build-job-2604
    - build-job-fedora
    - build-job-arch
    - build-doc
    - build-job-android
    - build-web-zip
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  variables:
    DOC_FILE_LATEST: "documentation_latest.tar.gz"
    WWW_ZIP_LATEST: "ostcore_latest_www.zip"
  script:
    - sh ./CI/CI-upload-release-latest.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push"'
