include:
  - local: CI/ci-images.yml
  - local: CI/fedora.yml
  - local: CI/arch.yml
  - local: CI/gsc.yml
  - local: CI/doc.yml
  - local: CI/android.yml
  - local: CI/web-zip.yml
  - local: CI/indi-3rdparty.yml

stages:
  - images
  - build
  - test
#  - upload
  - release

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  PACKAGE_REGISTRY_LATEST: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/latest/latest"
  PACKAGE_REGISTRY_TAG: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_COMMIT_TAG}/${CI_COMMIT_TAG}"
  # Global (not job-local like RPM_FILE_LATEST/co. elsewhere in this file)
  # - needed in both build-job-android (CI/android.yml) and
  # release-job-latest below, unlike those other variables which only ever
  # get read back by their own single build job's artifact step.
  APK_FILE_LATEST: "ostcore_latest.apk"

.build-rules: &build-rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_PIPELINE_SOURCE == "push"'

.test-rules: &test-rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_PIPELINE_SOURCE == "push"'

# 24.04 only builds/tests on an MR-to-main, a push that LANDS on main
# (a merge, since merging produces its own push pipeline rather than
# keeping the MR's merge_request_event one alive), or a release tag -
# never on a plain push to a feature branch. Unlike .build-rules/
# .test-rules above (still 26.04's own, unrestricted), so inlined
# separately here rather than sharing that anchor. The push-to-main
# condition is required for release-job-latest, which runs on exactly
# that push and depends on this job's artifacts - omitting it silently
# left the latest release missing 24.04/Fedora/Arch packages.
.build-rules-mr-or-tag: &build-rules-mr-or-tag
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.test-rules-mr-or-tag: &test-rules-mr-or-tag
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# SUSPENDED 2026-09-17 (Gilles): more effort than it's worth for now.
# Kept intact (rules: never) rather than deleted - see
# notes/NOTES-ci-overview.md and notes/NOTES-process-release-lifecycle.md.
build-job-2204:
  stage: build
  image: $CI_REGISTRY_IMAGE/ci-build:22.04
  variables:
    DEB_FILE_LATEST: "ostserver_latest_2204_amd64.deb"
    DEB_FILE_TAG: "ostserver_${CI_COMMIT_TAG}_2204_amd64.deb"
    DEB_FILE_DEV_LATEST: "ostserver-dev_latest_2204_amd64.deb"
    DEB_FILE_DEV_TAG: "ostserver-dev_${CI_COMMIT_TAG}_2204_amd64.deb"
    DEB_FILE_COMPLETE_LATEST: "ostserver-complete_latest_2204_amd64.deb"
    DEB_FILE_COMPLETE_TAG: "ostserver-complete_${CI_COMMIT_TAG}_2204_amd64.deb"
  script:
    - ./CI/CI-build.sh
  artifacts:
    paths:
      - "ostserver_*_2204_amd64.deb"
      - "ostserver-dev_*_2204_amd64.deb"
      - "ostserver-complete_*_2204_amd64.deb"
    expire_in: 4 week
  allow_failure: true
  rules:
    - when: never

build-job-2404:
  stage: build
  image: $CI_REGISTRY_IMAGE/ci-build:24.04
  variables:
    DEB_FILE_LATEST: "ostserver_latest_2404_amd64.deb"
    DEB_FILE_TAG: "ostserver_${CI_COMMIT_TAG}_2404_amd64.deb"
    DEB_FILE_DEV_LATEST: "ostserver-dev_latest_2404_amd64.deb"
    DEB_FILE_DEV_TAG: "ostserver-dev_${CI_COMMIT_TAG}_2404_amd64.deb"
    DEB_FILE_COMPLETE_LATEST: "ostserver-complete_latest_2404_amd64.deb"
    DEB_FILE_COMPLETE_TAG: "ostserver-complete_${CI_COMMIT_TAG}_2404_amd64.deb"
  script:
    - ./CI/CI-build.sh
  artifacts:
    paths:
