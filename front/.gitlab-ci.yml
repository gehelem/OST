# CI for ostcore: a debug-signed Android APK (Capacitor, android/ — see
# capacitor.config.json/package.json, fr.ostserver.ostcore, "OST") and a
# zip of the plain web build (www/ - same output, "meme si quasi
# identique au repo", Gilles 2026-10-06, for a direct web deploy without
# cloning the repo), built in parallel (two independent `build`-stage
# jobs, no dependency between them) and both published to the project's
# "latest" GitLab release, same pattern OST/.gitlab-ci.yml already uses
# for its own "latest" deb/rpm releases (generic package registry +
# release-cli, delete-then-recreate the "latest" release each time).
#
# iOS is NOT in scope here (no macOS runner / Apple Developer account
# available yet — see notes/NOTES-frontend-ostcore.md if that changes).
#
# Debug-signed, not a dedicated release keystore: zero signing setup,
# installs directly by sideload on any Android device — the right
# tradeoff for a "latest" build meant for personal/test use, not a Play
# Store release (Gilles, 2026-10-03, picking this over setting up a
# keystore now).

stages:
  - build
  - release

variables:
  PACKAGE_REGISTRY_LATEST: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/latest/latest"
  APK_FILE_LATEST: "ostcore_latest.apk"
  # Gilles, 2026-10-06: "ajoute dans la release un zip pour le html, meme
  # si quasi identique au repo" - the same www/ prepare-www already
  # produces for the Android build, zipped as its own release asset for a
  # direct web deploy. Built by its own job (below), in parallel with
  # build-android on a separate (lighter, no Android SDK) runner.
  WWW_ZIP_LATEST: "ostcore_latest_www.zip"

.build-rules: &build-rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_PIPELINE_SOURCE == "push"'

build-android:
  stage: build
  # Node + JDK + Android SDK/build-tools all in one, the common choice for
  # Capacitor/React Native CI - no custom image maintained for this
  # project yet (unlike OST/'s own $CI_REGISTRY_IMAGE/ci-build:*). It only
  # ships JDK 17 (Ubuntu 22.04 base, confirmed against its own Dockerfile,
  # github.com/react-native-community/docker-android) - Capacitor 7 (the
  # version this project pins) targets Java 21 by default
  # (android/app/capacitor.build.gradle, regenerated by `cap sync` itself,
  # not hand-edited), which that JDK can't compile ("invalid source
  # release: 21", the real pipeline's own first failure, 2026-10-03).
  # Installed explicitly below rather than downgrading the target - a
  # local build (JDK 21 already present on that machine) succeeded
  # against this exact same unmodified project.
  image: reactnativecommunity/react-native-android:latest
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq openjdk-21-jdk-headless
    - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
  script:
    - npm ci
    - npm run prepare-www
    - npx cap sync android
    - cd android
    - ./gradlew assembleDebug
    - cd ..
    - cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_FILE_LATEST"
  artifacts:
    paths:
      - "$APK_FILE_LATEST"
    expire_in: 4 week
  <<: *build-rules

build-web-zip:
  stage: build
  # No Android SDK needed for this one - a plain Node image is enough and
  # much faster than build-android's own (same `build` stage, no
  # dependency between the two, so GitLab runs them in parallel on
  # whichever runners are free - Gilles, 2026-10-06: "les builds peuvent
  # tourner en parallele sur plusieurs runners").
  image: node:20
  before_script:
    # node:20 (Debian) doesn't ship zip by default - same "install what's
    # actually missing" approach build-android's own before_script uses
    # for its own JDK gap.
    - apt-get update -qq
    - apt-get install -y -qq zip
  script:
    - npm ci
    - npm run prepare-www
    - cd www && zip -r "../$WWW_ZIP_LATEST" . && cd ..
  artifacts:
    paths:
      - "$WWW_ZIP_LATEST"
    expire_in: 4 week
  <<: *build-rules

release-latest:
  stage: release
  dependencies:
    - build-android
    - build-web-zip
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - sh ./CI/CI-upload-release-latest.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push"'
