<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OST — UI3</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="material-icons">nights_stay</span><span>OST</span></div>
      <span id="status-pill" class="status-pill disconnected">disconnected</span>
      <input id="ws-url" class="field-input" style="width:250px" placeholder="ws://host:9624">
      <input id="media-url" class="field-input" style="width:210px" placeholder="http://host/ostmedia/">
      <button id="connect-btn" class="btn btn-primary"><span class="material-icons">power</span>Connect</button>
      <button id="disconnect-btn" class="btn">Disconnect</button>
      <select id="lang-select" class="field-input">
        <option value="en">EN</option>
        <option value="fr">FR</option>
        <option value="de">DE</option>
        <option value="es">ES</option>
        <option value="it">IT</option>
      </select>
      <span class="topbar-spacer"></span>
      <span id="grant-pill" class="grant-pill"></span>
      <button id="theme-toggle" class="btn-icon" title="Toggle theme"><span class="material-icons">dark_mode</span></button>
    </header>
    <div id="shell">
      <nav id="sidebar"></nav>
      <main id="content"><div id="content-inner"></div></main>
    </div>
  </div>
  <div id="dialog-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
