name: CMake

on:
  push:
    branches: [ "main", "release" ]
  pull_request:
    branches: [ "main", "release" ]

permissions:
  contents: write        # create / update the "latest" release

env:
  BUILD_TYPE: Release
  DEB_RUNTIME: ostserver_latest_2604_amd64.deb
  DEB_DEV: ostserver-dev_latest_2604_amd64.deb

jobs:
  build:
    # Minimal presence build. Runs inside a plain ubuntu:26.04 container (not the
    # amd64v3 hosted runner) so ppa:mutlaqja/ppa - which only publishes amd64 -
    # resolves normally, exactly like a real install. Full matrix is on GitLab.
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git wget software-properties-common

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add ppa:mutlaqja/ppa
        run: |
          add-apt-repository -y ppa:mutlaqja/ppa
          apt-get update --error-on=any
          echo "--- libindi-dev candidates ---"
          apt-cache policy libindi-dev

      - name: Install dependencies
        run: |
          apt-get install -y \
            build-essential cmake git file dpkg-dev \
            qt6-base-dev qt6-websockets-dev qt6-scxml-dev qt6-tools-dev-tools \
            libindi-dev libnova-dev libgsl-dev wcslib-dev libcfitsio-dev \
            libavahi-client-dev libavahi-common-dev \
            zlib1g-dev libeigen3-dev libraw-dev libsecret-1-dev libopencv-dev \
            extra-cmake-modules

      - name: Check INDI version
        run: |
          v=$(dpkg-query -W -f='${Version}' libindi-dev)
          echo "libindi-dev $v"
          dpkg --compare-versions "$v" ge "2.0~" || {
            echo "::error::libindi-dev $v (< 2.0) - ppa:mutlaqja/ppa did not provide a package for this series"
            exit 1
          }

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=ignore

      - name: Package
        run: |
          cd build
          cpack -G DEB
          cp "$(ls ostserver_*_amd64.deb | head -1)" "$DEB_RUNTIME"
          cp "$(ls ostserver-dev_*_amd64.deb | head -1)" "$DEB_DEV"
          ls -l "$DEB_RUNTIME" "$DEB_DEV"

      - name: Release "latest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          prerelease: true
          body: "Rolling build of the default branch. Ubuntu 26.04 only - see GitLab for the full set."
          files: |
            build/${{ env.DEB_RUNTIME }}
            build/${{ env.DEB_DEV }}
