name: CMake

on:
  push:
    branches: [ "main", "release" ]
  pull_request:
    branches: [ "main", "release" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    # Minimal presence build. Ubuntu 26.04 is the only series ppa:mutlaqja/ppa
    # still publishes INDI for; the full per-series matrix lives in GitLab CI.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:mutlaqja/ppa
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git file dpkg-dev \
            qt6-base-dev qt6-websockets-dev qt6-scxml-dev qt6-tools-dev-tools \
            libindi-dev libnova-dev libgsl-dev wcslib-dev libcfitsio-dev \
            libavahi-client-dev libavahi-common-dev \
            zlib1g-dev libeigen3-dev libraw-dev libsecret-1-dev libopencv-dev \
            extra-cmake-modules

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build -j$(nproc)

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest --output-on-failure --no-tests=ignore
