# Arch Linux package build + release input (issue #230).
#
# Inline pacman for now, same reasoning as CI/fedora.yml: the C++
# compile dominates the job time, no prebuilt image needed yet.

build-job-arch:
  stage: build
  image: archlinux:latest
  variables:
    GIT_DEPTH: "0"      # pkgver is derived from git history (git describe)
    PKG_FILE_LATEST: "ostserver_latest_arch_x86_64.pkg.tar.zst"
    PKG_FILE_TAG: "ostserver_${CI_COMMIT_TAG}_arch_x86_64.pkg.tar.zst"
    PKG_FILE_COMPLETE_LATEST: "ostserver-complete_latest_arch_x86_64.pkg.tar.zst"
    PKG_FILE_COMPLETE_TAG: "ostserver-complete_${CI_COMMIT_TAG}_arch_x86_64.pkg.tar.zst"
  script:
    - ./CI/CI-build-arch.sh
  artifacts:
    paths:
      - "ostserver_*_arch_x86_64.pkg.tar.zst"
      - "ostserver-complete_*_arch_x86_64.pkg.tar.zst"
    expire_in: 4 week
  # YAML anchors don't carry across `include:`d files (same reason
  # CI/doc.yml inlines these same conditions (plus a push fallback that
  # one still keeps) instead of reusing &build-rules from
  # .gitlab-ci.yml) - kept literally identical otherwise.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'

test-job-arch:
  stage: test
  image: archlinux:latest
  dependencies:
    - build-job-arch
  variables:
    PKG_FILE_LATEST: "ostserver_latest_arch_x86_64.pkg.tar.zst"
  script:
    - ./CI/CI-test-arch.sh
  artifacts:
    paths:
      - server.log
      - ws.log
    expire_in: 4 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
