# Arch Linux package build + release input (issue #230).
#
# Inline pacman for now, same reasoning as CI/fedora.yml: the C++
# compile dominates the job time, no prebuilt image needed yet.

build-job-arch:
  stage: build
  image: archlinux:latest
  variables:
    GIT_DEPTH: "0"      # pkgver is derived from git history (git describe)
    PKG_FILE_LATEST: "ostserver_latest_arch_x86_64.pkg.tar.zst"
    PKG_FILE_TAG: "ostserver_${CI_COMMIT_TAG}_arch_x86_64.pkg.tar.zst"
    PKG_FILE_COMPLETE_LATEST: "ostserver-complete_latest_arch_x86_64.pkg.tar.zst"
    PKG_FILE_COMPLETE_TAG: "ostserver-complete_${CI_COMMIT_TAG}_arch_x86_64.pkg.tar.zst"
  script:
    - ./CI/CI-build-arch.sh
  artifacts:
    paths:
      - "ostserver_*_arch_x86_64.pkg.tar.zst"
      - "ostserver-complete_*_arch_x86_64.pkg.tar.zst"
    expire_in: 4 week
  # TEMPORARILY SUSPENDED 2026-10-09 (Gilles): focusing on the Fedora
  # debugging work, wants pipelines fast while that's ongoing. Arch
  # itself is already proven (green build, confirmed working install
  # on a real VM) - re-enable by restoring the three `if:` rules below
  # once done with Fedora (same anchors-don't-cross-files reasoning as
  # CI/doc.yml for why they're inlined, not `<<: *build-rules`).
  rules:
    - when: never

test-job-arch:
  stage: test
  image: archlinux:latest
  dependencies:
    - build-job-arch
  variables:
    PKG_FILE_LATEST: "ostserver_latest_arch_x86_64.pkg.tar.zst"
  script:
    - ./CI/CI-test-arch.sh
  artifacts:
    paths:
      - server.log
      - ws.log
    expire_in: 4 week
  # TEMPORARILY SUSPENDED alongside build-job-arch above.
  rules:
    - when: never
