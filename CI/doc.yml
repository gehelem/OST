build-doc:
  stage: build
  image: "hugomods/hugo:exts-0.122.0"
  variables:
    DOC_FILE_LATEST: "documentation_latest.tar.gz"
  script:
    - cd documentation
    - sh ./CI/CI-build.sh
  artifacts:
    paths:
      - documentation/documentation_*.tar.gz
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_PIPELINE_SOURCE == "push"'

# No standalone release job here: the doc tarball rides along in
# release-job-latest (.gitlab-ci.yml), next to the ostserver packages.
# A separate release-doc-latest used to race release-job-latest for the
# same "latest" release (both delete+recreate it) - whichever ran last
# silently wiped the other's assets.
