# Fedora RPM build + test + release input.
#
# SUSPENDED 2026-09-17 (Gilles): more noise than signal for now. Target
# architectures/distros are an open question, currently Ubuntu-only in
# practice - see notes/NOTES-ci-overview.md and
# notes/NOTES-process-release-lifecycle.md. Kept intact (rules: never)
# rather than deleted, for a cheap re-enable once that's settled.
#
# Inline dnf for now (no prebuilt image): the C++ compile dominates the job
# time, the dnf layer is ~1-2 min. Bake a CI/Dockerfile.build.rpm + a matrix
# later if pipeline time becomes a concern.

build-job-fedora:
  stage: build
  image: fedora:latest
  variables:
    GIT_DEPTH: "0"      # the version string is derived from git history
    RPM_FILE_LATEST: "ostserver_latest_fc_x86_64.rpm"
    RPM_FILE_TAG: "ostserver_${CI_COMMIT_TAG}_fc_x86_64.rpm"
    RPM_FILE_DEV_LATEST: "ostserver-devel_latest_fc_x86_64.rpm"
    RPM_FILE_DEV_TAG: "ostserver-devel_${CI_COMMIT_TAG}_fc_x86_64.rpm"
  script:
    - ./CI/CI-build-rpm.sh
  artifacts:
    paths:
      - "ostserver_*_fc_x86_64.rpm"
      - "ostserver-devel_*_fc_x86_64.rpm"
    expire_in: 4 week
  allow_failure: true
  rules:
    - when: never

test-job-fedora:
  stage: test
  image: fedora:latest
  dependencies:
    - build-job-fedora
  variables:
    RPM_FILE_LATEST: "ostserver_latest_fc_x86_64.rpm"
  script:
    - ./CI/CI-test-rpm.sh
  artifacts:
    paths:
      - server.log
      - ws.log
    expire_in: 4 week
  allow_failure: true
  rules:
    - when: never
