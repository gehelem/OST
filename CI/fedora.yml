# Fedora RPM build + test + release input.
#
# RE-ENABLED 2026-10-08 (Gilles, issue #230): was suspended since
# 2026-09-17 ("more noise than signal for now"); now extended with the
# ostserver-complete component (see cmake/cpack/RpmPackage.cmake) and
# turned back on to actually exercise it. allow_failure stays true
# below until a first green run, same cautious rollout build-job-arch
# had before its own first success.
#
# Inline dnf for now (no prebuilt image): the C++ compile dominates the job
# time, the dnf layer is ~1-2 min. Bake a CI/Dockerfile.build.rpm + a matrix
# later if pipeline time becomes a concern.

build-job-fedora:
  stage: build
  image: fedora:latest
  variables:
    GIT_DEPTH: "0"      # the version string is derived from git history
    RPM_FILE_LATEST: "ostserver_latest_fc_x86_64.rpm"
    RPM_FILE_TAG: "ostserver_${CI_COMMIT_TAG}_fc_x86_64.rpm"
    RPM_FILE_DEV_LATEST: "ostserver-devel_latest_fc_x86_64.rpm"
    RPM_FILE_DEV_TAG: "ostserver-devel_${CI_COMMIT_TAG}_fc_x86_64.rpm"
    RPM_FILE_COMPLETE_LATEST: "ostserver-complete_latest_fc_x86_64.rpm"
    RPM_FILE_COMPLETE_TAG: "ostserver-complete_${CI_COMMIT_TAG}_fc_x86_64.rpm"
  script:
    - ./CI/CI-build-rpm.sh
  artifacts:
    paths:
      - "ostserver_*_fc_x86_64.rpm"
      - "ostserver-devel_*_fc_x86_64.rpm"
      - "ostserver-complete_*_fc_x86_64.rpm"
    expire_in: 4 week
  allow_failure: true
  # YAML anchors don't carry across `include:`d files (same reason
  # CI/arch.yml inlines these same three conditions instead of reusing
  # &build-rules from .gitlab-ci.yml) - kept literally identical to it.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_PIPELINE_SOURCE == "push"'

test-job-fedora:
  stage: test
  image: fedora:latest
  dependencies:
    - build-job-fedora
  variables:
    RPM_FILE_LATEST: "ostserver_latest_fc_x86_64.rpm"
  script:
    - ./CI/CI-test-rpm.sh
  artifacts:
    paths:
      - server.log
      - ws.log
    expire_in: 4 week
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_PIPELINE_SOURCE == "push"'
